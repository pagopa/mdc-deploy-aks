microservice-chart:
  image:
    repository: ghcr.io/pagopa/emd-notifier-sender
    tag: v1.3.2
    pullPolicy: Always

  ingress:
    host: "mdc.itn.internal.cstar.pagopa.it"

  resources:
    requests:
      memory: "896Mi"
      cpu: "200m"
    limits:
      memory: "1536Mi"
      cpu: "600m"

  autoscaling:
    enable: true
    minReplica: 2
    maxReplica: 4
    pollingInterval: 30
    cooldownPeriod: 300
    envSourceContainerName: "emd-notifier-sender-microservice-chart"
    triggerAuthentications:
      - name: keda-evh-auth-message-core
        secretTargetRef:
          - parameter: username
            name: emd-notifier-sender-microservice-chart
            key: evh-emd-courtesy-message-v2-emd-courtesy-message-v2-consumer-keda-conn-username
          - parameter: password
            name: emd-notifier-sender-microservice-chart
            key: evh-emd-courtesy-message-v2-emd-courtesy-message-v2-consumer-keda-conn-string
      - name: keda-evh-auth-notify-error
        secretTargetRef:
          - parameter: username
            name: emd-notifier-sender-microservice-chart
            key: evh-emd-notify-error-v2-emd-notify-error-v2-consumer-keda-conn-username
          - parameter: password
            name: emd-notifier-sender-microservice-chart
            key: evh-emd-notify-error-v2-emd-notify-error-v2-consumer-keda-conn-string
    triggers:
      - type: kafka
        metadata:
          bootstrapServersFromEnv: "KAFKA_BROKER"
          consumerGroupFromEnv: "KAFKA_MESSAGE_CORE_GROUP_IN"
          topicFromEnv: "KAFKA_TOPIC_MESSAGE_CORE"
          lagThreshold: "10"
          offsetResetPolicy: "latest"
          sasl: "plaintext"
          tls: "enable"
        authenticationRef:
          name: keda-evh-auth-message-core
      - type: kafka
        metadata:
          bootstrapServersFromEnv: "KAFKA_BROKER"
          consumerGroupFromEnv: "KAFKA_NOTIFY_ERROR_GROUP_IN"
          topicFromEnv: "KAFKA_TOPIC_NOTIFY_ERROR"
          lagThreshold: "10"
          offsetResetPolicy: "latest"
          sasl: "plaintext"
          tls: "enable"
        authenticationRef:
          name: keda-evh-auth-notify-error

  podDisruptionBudget:
    create: true
    maxUnavailable: 1

  envConfig:
    MONGODB_DBNAME: mdc
    SERVER_SHUTDOWN: "graceful"
    SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "60s"
    BENEFICIARY_RULE_BUILD_DELAY_DURATION: "150"
    KAFKA_COMMANDS_MAX_POLL_SIZE: "10"
    # Quanti messaggi per pod possono essere elaborati in parallelo.
    # Deve essere <= KAFKA_COMMANDS_MAX_POLL_SIZE per evitare di saturare MongoDB.
    # Con 4 pod: 4 * 10 = 40 scritture MongoDB simultanee al massimo.
    KAFKA_CONSUMER_CONCURRENCY: "10"
    APPLICATIONINSIGHTS_ROLE_NAME: "emdnotifiersender"
    APPLICATIONINSIGHTS_INSTRUMENTATION_LOGGING_LEVEL: "INFO"
    APPLICATIONINSIGHTS_INSTRUMENTATION_MICROMETER_ENABLED: "false"
    APPLICATIONINSIGHTS_PREVIEW_PROFILER_ENABLED: "false"
    JAVA_TOOL_OPTIONS: >-
      -XX:InitialRAMPercentage=75.0
      -XX:MaxRAMPercentage=85.0
      -XX:+UseG1GC
      -XX:+UseContainerSupport
      -Djava.security.egd=file:/dev/./urandom
      -Djava.util.concurrent.ForkJoinPool.common.parallelism=7
      -Dio.netty.eventLoopThreads=100
      -javaagent:/app/applicationinsights-agent.jar
      -Dapplicationinsights.configuration.file=/mnt/file-config-external/appinsights-config/applicationinsights.json


  envSecret:
    MY_KV_SECRET: cstar-p-itn-prod-aks-apiserver-url

  keyvault:
    name: "cstar-p-itn-mdc-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"
